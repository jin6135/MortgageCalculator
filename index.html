<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mortgage Calculator</title>
  </head>
  <body>

    <h1>Canadian Mortgage Calculator</h1>
    <form id = "mortgage-form">
      <label for="home-price">Home Price (CAD)</label>
        <input type="number" id="home-price" min="0" placeholder="0.00"><br>

      <label for="down-payment">Down Payment (CAD)</label>
        <input type="number" id="down-payment" min="0" placeholder="0.00"><br>

      <label for="interest-rate">Interest Rate (%)</label>
        <input type="number" id="interest-rate" min="0" step="0.01" placeholder="5.00"><br>

      <label for="amortization">Amortization Period: 
        <span id="amortization-value">25</span> years
      </label>
        <input type="range" id="amortization" min="1" max="30" value="25" step="1"><br>

      <label for="payment-frequency">Payment Frequency</label>
      <select id="payment-frequency">
        <option value="12">Monthly</option>
        <option value="26">Bi-weekly</option>
        <option value="52">Weekly</option>
      </select><br>

      <button type="submit">Calculate</button>
    </form>

    <p>Monthly Mortgage Payment: </p>
    <input type="text" id="M" placeholder="Enter a value..."><br>

    <p>Principal (amount borrowed): </p>
    <input type="text" id="P" placeholder="Enter a value..."><br>

    <p>Monthly Interest Rate: </p>

    <p>Total Number of Monthly Payments: </p>
    <input type="text" id="n" placeholder="Enter a value..."><br>
  -->

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
